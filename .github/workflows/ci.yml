name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, zip, gd, xml
          coverage: none
      - run: composer validate --strict
      - run: composer config repositories.magmi-core vcs https://github.com/grinet/magmi2-core
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
